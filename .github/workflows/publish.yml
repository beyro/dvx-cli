# Publishes the dvx.cli NuGet package when a version tag (e.g. v1.11.0) is pushed.
# Uses NuGet Trusted Publishing: a GitHub OIDC token is exchanged for a short-lived
# API key, so no long-lived NuGet secret is stored in the repository.

name: Publish to NuGet

on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Fail fast if the pushed tag and the project version have drifted apart.
    - name: Verify tag matches project version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME -replace '^v', ''
        [xml]$csproj = Get-Content src/dvx/dvx.csproj
        $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        Write-Host "Tag version:     $tag"
        Write-Host "Project version: $version"
        if ($tag -ne $version) {
          Write-Error "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in src/dvx/dvx.csproj"
          exit 1
        }

    - name: Restore
      run: dotnet restore

    - name: Test
      run: dotnet test --verbosity normal

    - name: Build
      run: dotnet build -c Release

    # The temporary key lasts one hour and each OIDC token yields one key,
    # so request it immediately before pushing.
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: byronmatus

    - name: Push to NuGet
      shell: pwsh
      run: |
        $pkg = Get-ChildItem src/dvx/bin/Release/*.nupkg | Select-Object -First 1 -ExpandProperty FullName
        dotnet nuget push $pkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
